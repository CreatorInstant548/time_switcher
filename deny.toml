# cargo-deny (format v2), conforme à SEC0-02 et à la correction E4. Chemin sensible.

[graph]
# Contrôle aussi les dépendances atteintes par une fonctionnalité de développement.
# Ne vaut que pour cargo-deny : aucune construction ne passe --all-features (E3).
all-features = true

[advisories]
# Les vulnérabilités sont toujours refusées en v2.
yanked = "deny"
unmaintained = "all"
unsound = "all"
# Échec si la base RustSec a plus de 7 jours (SEC0-03).
maximum-db-staleness = "P7D"
# Chaque entrée : { id = "RUSTSEC-AAAA-NNNN", reason = "<raison> (<date>)" }, revue chaque semaine.
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
# Tout le reste est refusé, dont GPL, LGPL et AGPL. Aucune exception.
confidence-threshold = 0.93
exceptions = []
# Une licence permise mais encore inutilisée n'est pas une erreur.
unused-allowed-license = "allow"

[licenses.private]
# Crates de l'espace de travail (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Réseau et TLS refusés en phase 0 ; ils reviendront en phase 4 avec leurs `wrappers`.
deny = [
    { crate = "hyper", reason = "réseau interdit en phase 0 (SEC0-02)" },
    { crate = "native-tls", reason = "TLS système interdit en phase 0 (SEC0-02)" },
    { crate = "openssl", reason = "OpenSSL interdit (SEC0-02)" },
    { crate = "openssl-sys", reason = "OpenSSL interdit (SEC0-02, E4)" },
    { crate = "quinn", reason = "réseau interdit en phase 0 (SEC0-02)" },
    { crate = "reqwest", reason = "réseau interdit en phase 0 (SEC0-02)" },
    { crate = "tokio", reason = "réseau interdit en phase 0 (SEC0-02)" },
    { crate = "ureq", reason = "réseau interdit en phase 0 (SEC0-02)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
