# Cibles de fuzzing (SEC0-24), hors de l'espace de travail racine (exclude). Chemin sensible.
# spec: carnet architecture-securite.md SEC0-24 (révisé), §9.13
#
# En CI seulement, avec la nightly datée de nightly.yml (A14 : aucune nightly sur le poste) :
#   cargo run --locked --manifest-path fuzz/seeds/Cargo.toml -- fuzz/corpus/decode
#   cargo +<nightly> fuzz run decode fuzz/corpus/decode -- -max_total_time=3600
# Le corpus initial est régénérable : il n'est jamais commité (.gitignore, TS_CACHE).
# Le corps de la cible est `ts_persist::fuzzing::decode`, compilé et testé en stable.

[package]
name = "ts_persist_fuzz"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
ts_persist = { path = "../crates/ts_persist" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

# Espace de travail propre au fuzzing : la cible, et le programme du corpus initial, qui se
# compile en stable sans libFuzzer.
[workspace]
members = [".", "seeds"]

# Comme l'espace de travail racine (E2) : un dépassement d'entier panique, donc se voit.
[profile.release]
overflow-checks = true
debug = 1
