# Fuzzing targets (SEC0-24), outside the root workspace (exclude). Sensitive path.
# spec: carnet architecture-securite.md SEC0-24 (révisé), §9.13
#
# In CI only, with the dated nightly of nightly.yml (A14: no nightly on a workstation):
#   cargo run --locked --manifest-path fuzz/seeds/Cargo.toml -- fuzz/corpus
#   cargo +<nightly> fuzz run <target> -- -max_total_time=<3600 / number of targets>
# The seeds program writes fuzz/corpus/<target> for every target, which `cargo fuzz run` reads
# by default. The initial corpus is regenerable: it is never committed (.gitignore, TS_CACHE).
# Targets, each with its body compiled and tested on stable:
# - `decode`: snapshots, `ts_persist::fuzzing::decode`;
# - `content`: content pack, `ts_data::fuzzing::load` (m7 of the review of #47, #48).

[package]
name = "ts_persist_fuzz"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
ts_data = { path = "../crates/ts_data" }
ts_persist = { path = "../crates/ts_persist" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false
bench = false

# Workspace of the fuzzing alone: the targets, and the seeds program, which compiles on stable
# without libFuzzer.
[workspace]
members = [".", "seeds"]

# As in the root workspace (E2): an integer overflow panics, so it shows.
[profile.release]
overflow-checks = true
debug = 1
