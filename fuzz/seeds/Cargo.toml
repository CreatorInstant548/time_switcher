# Programme du corpus initial des cibles (SEC0-24) : stable, sans libFuzzer. Il écrit
# <dossier>/<cible> pour chaque cible de fuzz/ :
#   cargo run --locked --manifest-path fuzz/seeds/Cargo.toml -- <dossier du corpus>

[package]
name = "ts_persist_fuzz_seeds"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
ts_data = { path = "../../crates/ts_data" }
ts_kernel = { path = "../../crates/ts_kernel" }
ts_persist = { path = "../../crates/ts_persist" }
