    { path = "std::fs::File::open", reason = "aucune E/S dans le cœur : l'hôte lit et écrit les fichiers" },
    { path = "std::fs::OpenOptions::open", reason = "aucune E/S dans le cœur : l'hôte lit et écrit les fichiers" },
    { path = "std::fs::read", reason = "aucune E/S dans le cœur : l'hôte lit et écrit les fichiers" },
    { path = "std::fs::read_dir", reason = "aucune E/S dans le cœur : l'hôte lit et écrit les fichiers" },
