# Bans of the core: SEC0-22, architecture §9.2, fixes E1, E5 and m2; restore contract AS-27
# (#31): no `Local` and no change detection (filters, removals, ticks, `DetectChanges` reads),
# no tick read by inference and no manual sync point inside a phase (AS-57, #93).
# The bevy_ecs paths below are checked against bevy_ecs 0.20.0: an xtask test fails when the
# version changes, so that they are checked again (`allow-invalid` would hide a moved path).
# A type ban only sees a type written by name: a value of a banned type returned by an allowed
# method (`component_index()`, `get_empty_labels()`) stays unflagged, a limit of the lint (#12).
# Seules les crates d'hôte et d'outil peuvent s'en exempter localement (docs/dev/espace-travail.md).

