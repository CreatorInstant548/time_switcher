# Interdictions du cœur : SEC0-22, architecture §9.2, corrections E1, E5 et m2.
# Seules les crates d'hôte et d'outil peuvent s'en exempter localement (docs/dev/espace-travail.md).

allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "bevy_ecs::schedule::IntoScheduleConfigs::ambiguous_with", reason = "arête d'ambiguïté non détectée à la construction (L7) : ordonner les systèmes explicitement (architecture §9.2, issue #12)", allow-invalid = true },
