[package]
name = "ts_persist"
version = "0.0.0"
description = "Codec borné des instantanés et format de parts adressées de time_switcher."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Chemin sensible (SEC0-23). Toute dépendance nouvelle est justifiée dans la PR (SEC0-05) ;
# `ruzstd` est en pur Rust, sans compilateur C (K10, carnet architecture-securite.md §9.13 Q1).
[dependencies]
blake3.workspace = true
postcard.workspace = true
ruzstd.workspace = true
serde.workspace = true
ts_kernel = { path = "../ts_kernel" }

# The `bevy_ecs` derives in the tests name the crate itself.
# `cap`: counting allocator with a cap, for the memory peak test of M41h
# (`tests/peak_memory.rs`); no dependency of its own, MIT or Apache-2.0. Declared here rather
# than in `[workspace.dependencies]`: only this test uses it.
[dev-dependencies]
bevy_ecs.workspace = true
cap = { version = "=0.1.2", default-features = false }

[lints]
workspace = true
