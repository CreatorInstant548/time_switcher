[package]
name = "ts_runner"
version = "0.0.0"
description = "Tool host of time_switcher: content directories for ts_data, ts-data check, and the ts-sim runner."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ts-sim"
path = "src/main.rs"

# `ts-data check`: checks a content directory and measures its data bounds (A15 M39).
[[bin]]
name = "ts-data"
path = "src/bin/ts_data.rs"

# Tool crate (xtask manifests.rs, TOOLS): it alone may depend on the test crate `ts_toy`, and it
# is in no public binary. `parquet` without `arrow` and without any compression (Y1).
[dependencies]
blake3.workspace = true
parquet.workspace = true
ron.workspace = true
serde.workspace = true
ts_data = { path = "../ts_data" }
ts_kernel = { path = "../ts_kernel" }
ts_toy = { path = "../ts_toy" }

# Wall time of the toy world's time skip per thread count (issue #67): a measurement, not a
# test. In this tool crate, since it reads the wall clock and its command line (E6).
[[bench]]
name = "time_skip"
harness = false

[lints]
workspace = true
