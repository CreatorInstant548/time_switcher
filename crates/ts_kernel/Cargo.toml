[package]
name = "ts_kernel"
version = "0.0.0"
description = "Simulation kernel of time_switcher: a library with no display and no I/O."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Build profiles (SEC0-20): no default feature. `public` is only enabled on the command line,
# never from another Cargo.toml; it excludes the other four.
[features]
default = []
dev-bench = []
dev-commands = []
dev-introspection = []
external-pilot = []
public = []

[dependencies]
bevy_ecs.workspace = true
bevy_tasks.workspace = true
blake3.workspace = true
chacha20.workspace = true

[lints]
workspace = true
