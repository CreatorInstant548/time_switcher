[package]
name = "ts_data"
version = "0.0.0"
description = "Content pack of time_switcher: bounded RON loading, validation and fingerprint."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# No file access (core crate, no I/O): the host reads the files, see `ts_runner`.
# `unicode-normalization` for the NFC check of display names (M40e): pure Rust, no `std`
# needed, MIT or Apache-2.0, maintained by the unicode-rs project.
# `unicode-properties` for the general categories of the characters of a display name
# (M40e, A17): pure Rust, no dependency, `general-category` feature only, MIT or Apache-2.0
# (`=0.1.4`, published on 30/10/2025). Its table is Unicode 17.0.0, the version of
# `unicode-normalization` 0.1.25; a test fails if the two ever differ.
# `ts_kernel` only for `not_public!`, which keeps the fuzzing body (`fuzzing`) out of the
# `public` profile, as in `ts_persist` (#48); the pack itself uses no kernel type.
[dependencies]
blake3.workspace = true
ron.workspace = true
serde.workspace = true
ts_kernel = { path = "../ts_kernel" }
unicode-normalization.workspace = true
unicode-properties.workspace = true

[lints]
workspace = true
