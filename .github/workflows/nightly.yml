# .github/workflows/nightly.yml : tâche périodique sur main. Mode d'emploi : docs/dev/ci.md §4.
# Chaque nuit : cargo audit et cargo deny check advisories ; cargo xtask verify-main --origin 7d
# (approbations de chaque commit sensible de main, V5 ; chaque commit des 7 derniers jours est le
# squash d'une PR fusionnée, avec ci-ok, AS-42 et AS-44). Le dimanche et par workflow_dispatch :
# --origin all, J3 seul.
# Le dimanche, en plus, si main a changé depuis la dernière exécution hebdomadaire réussie :
# Windows complet, gitleaks sur tout l'historique, fuzzing (sauté tant que fuzz/ n'existe pas),
# cargo xtask determinism --full (an complet du monde-jouet, Y5).
# En cas d'échec, le travail report ouvre ou complète une issue nightly-failure ; si verify-main
# échoue ou est annulé, aussi l'issue d'anomalie qui suspend cargo xtask merge (AS-52).
# Contrôlé par cargo xtask check --only workflows (SEC0-29 à 31, G7).
# spec: carnet architecture-securite.md SEC0-17, SEC0-29, SEC0-30, SEC0-33 ; §9.6 G6, G9, G10 ; §9.14 V3 ; §9.15 Y5
name: nightly

on:
  schedule:
    - cron: '17 3 * * 1-6'
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Nightly datée du fuzzing (G6) : elle s'avance par une PR, comme tools.lock.
  FUZZ_TOOLCHAIN: nightly-2026-10-01
  FUZZ_TOTAL_SECONDS: "3600"

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Outils épinglés
        id: audit
        run: |
          echo "TS_CACHE=$RUNNER_TEMP/ts-cache" >> "$GITHUB_ENV"
          export TS_CACHE="$RUNNER_TEMP/ts-cache"
          bash tools/ci/install-tools.sh rust
          bash tools/ci/install-tools.sh cargo-deny
          bash tools/ci/install-tools.sh version cargo-audit
      - name: Cache de cargo-audit
        id: audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ts-tools/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.audit.outputs.version }}
      - name: cargo-audit épinglé
        run: bash tools/ci/install-tools.sh cargo-audit
      - name: Enregistrement du cache de cargo-audit (main seulement)
        if: github.ref == 'refs/heads/main' && steps.audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ts-tools/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ steps.audit.outputs.version }}
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check advisories
        run: cargo deny --locked check advisories

  verify-main:
    name: verify-main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      # fetch-depth: 0 brings origin/main and origin/pilotage (J4); verify-main skips git fetch
      # in CI mode, so the job keeps no Git credentials (m2 of #52).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Chaîne Rust
        run: bash tools/ci/install-tools.sh rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --dry-run: the read-only token cannot open issues; an anomaly fails the job and report
      # opens nightly-failure. In CI, repo-settings.ps1 -Check is skipped with a warning.
      # AS-42, AS-44: every commit of the last 7 days must be the squash of a merged PR with ci-ok
      # green on its head (J3 and G3); Sunday and workflow_dispatch: all of them, J3 alone (#55).
      # rule-suites is not read: it needs the Administration permission, which the job token
      # cannot have.
      - name: cargo xtask verify-main --origin
        env:
          GH_TOKEN: ${{ github.token }}
          TS_CACHE: ${{ runner.temp }}/ts-cache
          ORIGIN: ${{ (github.event.schedule == '17 3 * * 0' || github.event_name == 'workflow_dispatch') && 'all' || '7d' }}
        run: cargo xtask verify-main --dry-run --origin "$ORIGIN"

  windows:
    name: windows
    if: github.event.schedule == '17 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: main a-t-il changé ?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci/main-changed.sh
      - name: Chaîne Rust
        if: steps.gate.outputs.changed == 'true'
        run: bash tools/ci/install-tools.sh rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.gate.outputs.changed == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: xtask check --all (hors étapes de sécurité de ci.yml)
        if: steps.gate.outputs.changed == 'true'
        run: cargo xtask check --all --only fmt,clippy,test,determinism,unsafe,profiles,features,clippy-exemptions,local-paths,spec-map

  gitleaks-history:
    name: gitleaks-history
    if: github.event.schedule == '17 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: main a-t-il changé ?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci/main-changed.sh
      - name: gitleaks épinglé et auto-test
        if: steps.gate.outputs.changed == 'true'
        run: |
          echo "TS_CACHE=$RUNNER_TEMP/ts-cache" >> "$GITHUB_ENV"
          export TS_CACHE="$RUNNER_TEMP/ts-cache"
          bash tools/ci/install-tools.sh gitleaks
          bash tools/ci/install-tools.sh gitleaks-selftest
      - name: gitleaks sur tout l'historique, toutes les branches
        if: steps.gate.outputs.changed == 'true'
        run: |
          if [ -e .gitleaksignore ]; then
            echo "::error::.gitleaksignore à la racine refusé (SEC0-08)."
            exit 1
          fi
          gl="$TS_GITLEAKS_DIR"
          "$gl/gitleaks" git --config "$gl/gitleaks.toml" --gitleaks-ignore-path "$gl" --ignore-gitleaks-allow \
            --redact --no-banner --log-level warn \
            --log-opts="--all --text --no-ext-diff --no-textconv" .

  fuzz:
    name: fuzz
    if: github.event.schedule == '17 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Cibles de fuzzing présentes ?
        id: present
        run: |
          if [ -d fuzz ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de dossier fuzz/ : fuzzing sauté."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: main a-t-il changé ?
        id: gate
        if: steps.present.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci/main-changed.sh
      - name: cargo-fuzz épinglé
        if: steps.gate.outputs.changed == 'true'
        run: bash tools/ci/install-tools.sh cargo-fuzz
      # Initial corpus of every target, fuzz/corpus/<target> (SEC0-24), regenerated on each run,
      # never committed. --locked also refuses a stale fuzz/Cargo.lock: cargo fuzz has no
      # --locked option.
      - name: Initial corpus
        if: steps.gate.outputs.changed == 'true'
        run: cargo "+$FUZZ_TOOLCHAIN" run --locked --manifest-path fuzz/seeds/Cargo.toml -- fuzz/corpus
      - name: Fuzzing de toutes les cibles
        if: steps.gate.outputs.changed == 'true'
        run: |
          mapfile -t targets < <(cargo "+$FUZZ_TOOLCHAIN" fuzz list)
          [ "${#targets[@]}" -gt 0 ] || { echo "::error::aucune cible dans fuzz/."; exit 1; }
          per=$(( FUZZ_TOTAL_SECONDS / ${#targets[@]} ))
          for t in "${targets[@]}"; do
            echo "Cible $t : $per s"
            cargo "+$FUZZ_TOOLCHAIN" fuzz run "$t" -- "-max_total_time=$per"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.gate.outputs.changed == 'true'
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 7
          if-no-files-found: ignore

  determinism:
    name: determinism
    if: github.event.schedule == '17 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: main a-t-il changé ?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash tools/ci/main-changed.sh
      - name: Chaîne Rust
        if: steps.gate.outputs.changed == 'true'
        run: bash tools/ci/install-tools.sh rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.gate.outputs.changed == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Short version and full year, 1 and 4 threads in separate processes, each against its own
      # golden values in data/golden/ts_toy.json (Y5).
      - name: cargo xtask determinism --full
        if: steps.gate.outputs.changed == 'true'
        run: cargo xtask determinism --full

  report:
    name: report
    if: failure() || cancelled()
    needs: [advisories, verify-main, windows, gitleaks-history, fuzz, determinism]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # AS-52 (AU8): a failed or cancelled verify-main opens (or comments) the issue under the
      # exact title that cargo xtask merge counts as an anomaly (github::NIGHTLY_ANOMALY_TITLE,
      # author github-actions[bot]): merges stop at once, without waiting for the daily local
      # verify-main. Same rules as below: no checkout, no code of the repository is run (G9).
      # always(): without it, GitHub adds success(), which is false in a cancelled run.
      # The title stays the French text fixed by AS-52, the same as github::NIGHTLY_ANOMALY_TITLE.
      - name: Anomaly issue of verify-main (no checkout, G9)
        if: always() && (needs.verify-main.result == 'failure' || needs.verify-main.result == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_VERIFY_MAIN: ${{ needs.verify-main.result }}
          NIGHTLY_ANOMALY_TITLE: "verify-main : anomalie détectée par la tâche périodique"
        run: |
          body=$(printf 'verify-main %s in the nightly run: cargo xtask merge refuses every merge while this issue is open.\n\n- Run: %s\n- Clear the finding, then close this issue: docs/dev/ci.md section 4.\n' "$R_VERIFY_MAIN" "$RUN_URL")
          # The open issue of this bot under this exact title, as github::is_anomaly reads it.
          # A failed lookup opens a new issue: one more anomaly issue only stops merges.
          nums=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.NIGHTLY_ANOMALY_TITLE and .user.login == "github-actions[bot]" and .user.type == "Bot") | .number') \
            || nums=""
          num=${nums%%[!0-9]*}
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh label create nightly-failure --color B60205 --description "Échec de nightly.yml" 2>/dev/null || true
            gh label create role:architecture --color 5319E7 2>/dev/null || true
            gh issue create --title "$NIGHTLY_ANOMALY_TITLE" --label nightly-failure --label role:architecture --body "$body"
          fi
      - name: Issue nightly-failure (sans checkout, G9)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_ADVISORIES: ${{ needs.advisories.result }}
          R_VERIFY_MAIN: ${{ needs.verify-main.result }}
          R_WINDOWS: ${{ needs.windows.result }}
          R_GITLEAKS: ${{ needs.gitleaks-history.result }}
          R_FUZZ: ${{ needs.fuzz.result }}
          R_DETERMINISM: ${{ needs.determinism.result }}
          FAILURE_TITLE: "Tâche périodique en échec"
        run: |
          failed=""
          for pair in "advisories=$R_ADVISORIES" "verify-main=$R_VERIFY_MAIN" "windows=$R_WINDOWS" "gitleaks-history=$R_GITLEAKS" "fuzz=$R_FUZZ" "determinism=$R_DETERMINISM"; do
            case ${pair#*=} in failure|cancelled) failed="$failed ${pair%%=*} (${pair#*=})" ;; esac
          done
          body=$(printf 'Nightly run failed.\n\n- Failed jobs:%s\n- Run: %s\n' "$failed" "$RUN_URL")
          gh label create nightly-failure --color B60205 --description "Échec de nightly.yml" 2>/dev/null || true
          # Only the bot's issue under this title, never the anomaly issue (also nightly-failure).
          nums=$(gh api --paginate "repos/$GH_REPO/issues?state=open&labels=nightly-failure&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.FAILURE_TITLE and .user.login == "github-actions[bot]" and .user.type == "Bot") | .number')
          num=${nums%%[!0-9]*}
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$FAILURE_TITLE" --label nightly-failure --body "$body"
          fi
