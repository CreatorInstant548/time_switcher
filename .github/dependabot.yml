# .github/dependabot.yml : mises à jour des dépendances Cargo et des actions épinglées (G11).
# Hebdomadaire, regroupées, au plus 2 PR ouvertes par écosystème, versions publiées depuis 7 jours au moins.
# Titres build(deps): … pour le travail pr-title. Ses PR touchent des chemins sensibles : avis d'archi-sécu.
# spec: carnet architecture-securite.md §9.6 G11
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: build
      include: scope
