gitleaks.path = "C:/Dev/tools/gitleaks/gitleaks.exe"
gitleaks.sha256 = "17157e2ee8b76fc8b1d8bee607a250e34b8a8023c8bc81822d4b5ee4d78fcb7c"

cargo-deny.version = "0.20.2"
cargo-deny.source = "crates.io (cargo install --locked --version 0.20.2 cargo-deny)"

