# tools/dev/tools.lock : outils tiers épinglés (SEC0-06). Format TOML à clés pointées, une clé par ligne,
# lu par les crochets Git (sed) et par install-hooks.ps1 ; toute mise à jour passe par une PR de chemin sensible.
# gitleaks.sha256 est l'empreinte de l'exécutable, vérifiée avant chaque usage ;
# gitleaks.archive_sha256 celle de l'archive officielle, contrôlée contre le fichier de sommes de la version.

gitleaks.version = "8.30.1"
